careerprofile:
  title: Career Profile
  summary: |
    Full-stack software engineer with 20 years of experience, still writing code every day. I work at the intersection of regulated consumer finance and applied artificial intelligence (AI). At Türk Finansman/Kredim, I build credit-scoring and decision-support systems, a locally hosted retrieval-augmented generation (RAG) service, privacy tooling, and reporting automation. I work across Python, SQL, TypeScript, Java, and Rust, tracing business rules from source data through services and interfaces to tested, reviewable outcomes. Earlier in my career, I delivered systems across e-commerce, game operations, payment systems, factory software, mobile platforms, and real-time event processing.

